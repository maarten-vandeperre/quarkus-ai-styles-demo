########################################################################
# PROVIDER SWITCHING
#
# Pick ONE provider by changing the single line below and restarting
# (in dev mode, `quarkus dev` picks the change up on live reload).
#
#   openai | anthropic | mistral | kimi | gemini | ollama | qwen
#
# Each provider is defined as a Quarkus configuration profile further
# down in this file. API keys are read from environment variables so
# they never end up in git. See README.md for how to obtain each key.
########################################################################
quarkus.profile=openai

# NOTE: `quarkus.langchain4j.chat-model.provider` is a BUILD-TIME property.
# In dev mode that is transparent (live reload rebuilds), but for a
# production build you bake the provider in at build time:
#   ./gradlew build -Dquarkus.profile=anthropic

########################################################################
# Shared settings (apply to every provider)
########################################################################
# Log full request/response payloads while developing - great for seeing
# the difference between plain calls, RAG-augmented prompts and tool loops.
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# Easy RAG: ingest every document in this folder at startup and wire a
# retrieval augmentor into AI services that opt in.
quarkus.langchain4j.easy-rag.path=src/main/resources/rag-docs
quarkus.langchain4j.easy-rag.max-segment-size=512
quarkus.langchain4j.easy-rag.max-overlap-size=64
quarkus.langchain4j.easy-rag.max-results=3

# Force the local (in-process, ONNX) embedding model so retrieval is
# identical across every chat provider and needs no extra API key.
quarkus.langchain4j.embedding-model.provider=dev.langchain4j.model.embedding.onnx.bgesmallenq.BgeSmallEnQuantizedEmbeddingModel

########################################################################
# MCP client: connect to a filesystem MCP server over stdio.
# The server exposes file tools (list/read/write) for the ./playground
# folder - our "cellar" in the bar analogy. Requires Node.js (npx).
# On Windows, WindowsNpxConfigSource switches cellar.npx to npx.cmd
# (Java cannot start the npx batch file by its short name).
########################################################################
cellar.npx=npx
quarkus.langchain4j.mcp.cellar.log-requests=true
quarkus.langchain4j.mcp.cellar.log-responses=true
quarkus.langchain4j.mcp.cellar.transport-type=stdio
# MAC: start npx direct
#quarkus.langchain4j.mcp.cellar.command=${cellar.npx},-y,@modelcontextprotocol/server-filesystem,playground
# Windows: start npx through cmd.exe
quarkus.langchain4j.mcp.cellar.command=cmd.exe,/c,npx,-y,@modelcontextprotocol/server-filesystem,playground

########################################################################
# Profile: OpenAI
# Key: https://platform.openai.com -> API keys
########################################################################
%openai.quarkus.langchain4j.chat-model.provider=openai
%openai.quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:missing-key}
%openai.quarkus.langchain4j.openai.chat-model.model-name=gpt-5-mini
%openai.quarkus.langchain4j.openai.timeout=60s

########################################################################
# Profile: Anthropic (Claude)
# Key: https://console.anthropic.com -> API keys
########################################################################
%anthropic.quarkus.langchain4j.chat-model.provider=anthropic
%anthropic.quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:missing-key}
%anthropic.quarkus.langchain4j.anthropic.chat-model.model-name=claude-sonnet-4-6
%anthropic.quarkus.langchain4j.anthropic.chat-model.max-tokens=2048
%anthropic.quarkus.langchain4j.anthropic.timeout=60s

########################################################################
# Profile: Mistral AI
# Key: https://console.mistral.ai -> API keys
########################################################################
%mistral.quarkus.langchain4j.chat-model.provider=mistralai
%mistral.quarkus.langchain4j.mistralai.api-key=${MISTRAL_API_KEY:missing-key}
%mistral.quarkus.langchain4j.mistralai.chat-model.model-name=mistral-small-latest
%mistral.quarkus.langchain4j.mistralai.timeout=60s

########################################################################
# Profile: Kimi (Moonshot AI) - via its OpenAI-compatible endpoint
# Key: https://platform.moonshot.ai -> API keys
# Check the platform for currently available model names.
########################################################################
%kimi.quarkus.langchain4j.chat-model.provider=openai
%kimi.quarkus.langchain4j.openai.base-url=https://api.moonshot.ai/v1
%kimi.quarkus.langchain4j.openai.api-key=${KIMI_API_KEY:missing-key}
%kimi.quarkus.langchain4j.openai.chat-model.model-name=kimi-k2-0711-preview
%kimi.quarkus.langchain4j.openai.timeout=90s

########################################################################
# Profile: Gemini (Google) - via its OpenAI-compatible endpoint
# Key: https://aistudio.google.com -> Get API key
########################################################################
%gemini.quarkus.langchain4j.chat-model.provider=openai
%gemini.quarkus.langchain4j.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
%gemini.quarkus.langchain4j.openai.api-key=${GEMINI_API_KEY:missing-key}
%gemini.quarkus.langchain4j.openai.chat-model.model-name=gemini-2.5-flash
%gemini.quarkus.langchain4j.openai.timeout=60s

########################################################################
# Profile: Ollama (local models - no API key needed)
# Install: https://ollama.com  then:  ollama pull gemma4:12b
########################################################################
%ollama.quarkus.langchain4j.chat-model.provider=ollama
%ollama.quarkus.langchain4j.ollama.chat-model.model-name=gemma4:12b
%ollama.quarkus.langchain4j.ollama.chat-model.temperature=0.7
%ollama.quarkus.langchain4j.ollama.timeout=120s

########################################################################
# Profile: Qwen via Podman Desktop AI Lab (local — no API key needed)
# Install Podman Desktop, add the AI Lab extension, download
# qwen/qwen3-4b-GGUF, then start a model service on port 35000.
# Docs: https://podman-desktop.io/docs/ai-lab/start-inference-server
# The service speaks the OpenAI chat API. If Service Details shows
# another port, set PODMAN_AI_BASE_URL=http://localhost:<port>/v1
########################################################################
%qwen.quarkus.langchain4j.chat-model.provider=openai
%qwen.quarkus.langchain4j.openai.base-url=${PODMAN_AI_BASE_URL:http://localhost:53132/v1}
%qwen.quarkus.langchain4j.openai.api-key=sk-podman
%qwen.quarkus.langchain4j.openai.chat-model.model-name=qwen/qwen3-4b-GGUF
%qwen.quarkus.langchain4j.openai.timeout=180s

########################################################################
# Decision model (POST /ai/decision -> CoffeeDecisionService)
#
# A decision model answers typed questions (choice / yes-no / score) with
# probabilities, not text. It does NOT follow quarkus.profile; pick one here:
#
#   openai  OpenAI Decisions API (POST {base-url}/decisions) on any server
#           that has it: the Developer Sandbox decision gateway
#           (oc port-forward svc/decision-gateway 8000:8080), vLLM,
#           DiffusionGemma, Granite Switch, OpenAI.
#   gemma   Gemma 4 on the local Ollama, through the local decision gateway:
#             ollama pull gemma4
#             podman compose up -d decision-gateway
#   kev     kev on the local Ollama, Ollama's own decision API, no gateway:
#             ollama pull kev:0.8b-q8_0
#
# Override without editing this file: DECISION_PROVIDER=kev
########################################################################
decision.provider=${DECISION_PROVIDER:gemma}

# gemma: the local gateway (compose.yaml) and the Ollama model it should use.
decision.gemma.base-url=${DECISION_GEMMA_BASE_URL:http://localhost:8000/v1}
decision.gemma.model-name=${DECISION_GEMMA_MODEL:gemma4:latest}

# kev: Ollama itself. Tags: kev:0.8b-q8_0 (812 MB, any OS),
# kev:9b-q4_K_M (5.6 GB, better), *-mlx-* and *-nvfp4 (Apple Silicon only).
decision.kev.base-url=${DECISION_KEV_BASE_URL:http://localhost:11434}
decision.kev.model-name=${DECISION_KEV_MODEL:kev:0.8b-q8_0}

# openai: property names follow the quarkus-langchain4j OpenAI decision model
# (named model "decision"); see DecisionModels for why it is wired by hand.
# Timeout and logging below apply to all three providers.
quarkus.langchain4j.openai.decision.base-url=${DECISION_BASE_URL:http://localhost:8000/v1}
quarkus.langchain4j.openai.decision.api-key=${DECISION_API_KEY:sk-none}
quarkus.langchain4j.openai.decision.decision-model.model-name=${DECISION_MODEL:decision}
quarkus.langchain4j.openai.decision.timeout=120s
quarkus.langchain4j.openai.decision.decision-model.log-requests=true
quarkus.langchain4j.openai.decision.decision-model.log-responses=true

########################################################################
# Browser access for the OpenAI-compatible chat API (/v1/*).
# Open WebUI in Docker calls this app from its own backend, which needs
# no CORS. These origins cover a browser on the host talking to the API
# directly (Open WebUI "direct connections", or another local UI).
########################################################################
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,origin,x-requested-with

# Host header validation. When Quarkus listens on localhost (the dev-mode
# default) it only accepts requests whose Host header is localhost,
# 127.0.0.1 or [::1], and answers anything else with an empty 400.
# Open WebUI in a container calls http://host.docker.internal:8080 (Docker)
# or host.containers.internal (Podman), so those names are allowed too.
quarkus.http.host-validation.allowed-hosts=localhost,127.0.0.1,[::1],host.docker.internal,host.containers.internal
