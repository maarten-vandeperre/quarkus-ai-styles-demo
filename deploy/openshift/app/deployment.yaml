apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-ai-styles-demo
  labels:
    app.kubernetes.io/name: quarkus-ai-styles-demo
  annotations:
    # Roll out every new image the BuildConfig pushes.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"quarkus-ai-styles-demo:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quarkus-ai-styles-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quarkus-ai-styles-demo
    spec:
      containers:
        - name: app
          image: quarkus-ai-styles-demo:latest
          envFrom:
            - configMapRef:
                name: quarkus-app-config
            # Optional provider keys for the chat patterns (/ai/plain, ...):
            #   oc create secret generic ai-provider-keys --from-literal=OPENAI_API_KEY=sk-...
            - secretRef:
                name: ai-provider-keys
                optional: true
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
