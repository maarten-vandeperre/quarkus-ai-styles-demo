# OpenShift AI cluster with a GPU (>= 40 GB):
#   app -> DiffusionGemma on vLLM, using vLLM's own /v1/decisions
#
#   oc apply -k deploy/openshift/overlays/gpu -n <namespace>
#
# The decision gateway is deployed too, pointed at DiffusionGemma's chat
# endpoint. If this vLLM build answers /v1/decisions with 501 (no decision
# read strategy for the model), switch the app to the gateway:
#   DECISION_BASE_URL=http://decision-gateway:8080/v1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../diffusiongemma
  - ../../decision-gateway
  - ../../app

configMapGenerator:
  - name: decision-gateway-config
    behavior: merge
    literals:
      - BACKEND_URL=http://diffusiongemma-predictor/v1
      - BACKEND_MODEL=diffusiongemma
  - name: quarkus-app-config
    behavior: merge
    literals:
      - DECISION_BASE_URL=http://diffusiongemma-predictor/v1
      - DECISION_MODEL=diffusiongemma
